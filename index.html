<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шарын Шатқалы: Эко-туризм 3D Моделі</title>
  <meta name="description" content="Шарын шатқалының интерактивті 3D эко-туризм моделі: маусымдық көріністер, камера режимдері және экономикалық тиімділік калькуляторы." />
  <meta property="og:title" content="Шарын Шатқалы: Эко-туризм 3D Моделі" />
  <meta property="og:description" content="Шарын шатқалының интерактивті 3D эко-туризм моделі: маусымдық көріністер, камера режимдері және экономикалық тиімділік калькуляторы." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --hud-bg: rgba(15, 23, 42, 0.84);
      --hud-bg-hover: rgba(30, 41, 59, 0.94);
      --hud-border: rgba(255, 255, 255, 0.16);
      --hud-text: #f8fafc;
      --hud-muted: #cbd5e1;
      --accent: #f59e0b;
      --accent-strong: #d97706;
      --teal: #14b8a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87ceeb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--hud-text);
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .hud-wrapper {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-card {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      max-width: 440px;
    }

    .title-card h1 {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      line-height: 1.3;
    }

    .title-subtitle {
      margin-top: 4px;
      font-size: 0.78rem;
      color: var(--hud-muted);
      line-height: 1.35;
    }

    .calc-card {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 14px;
      width: 310px;
      max-width: calc(100vw - 36px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .calc-header {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--hud-text);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }

    .calc-header:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .calc-chevron {
      font-size: 0.8rem;
      color: var(--accent);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .calc-card.collapsed .calc-chevron {
      transform: rotate(-90deg);
    }

    .calc-body {
      padding: 4px 16px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .calc-card.collapsed .calc-body {
      display: none;
    }

    .slider-group {
      margin-top: 12px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .slider-label {
      color: var(--hud-muted);
      font-weight: 500;
    }

    .slider-value {
      color: #ffffff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .metric-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 10px;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--hud-muted);
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--teal);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .metric-value.payback {
      color: #fbbf24;
    }

    .bottom-dock {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
    }

    .dock-panel {
      pointer-events: auto;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 96vw;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dock-divider {
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, 0.16);
    }

    .hud-btn {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: var(--hud-text);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .hud-btn:active {
      transform: scale(0.97);
    }

    .hud-btn.active {
      background: var(--accent);
      border-color: #fde68a;
      color: #0f172a;
    }

    .hud-btn.cam-btn.active {
      background: var(--teal);
      border-color: #99f6e4;
      color: #042f2e;
    }

    @media (max-width: 760px) {
      .hud-wrapper {
        padding: 12px;
      }

      .title-card {
        padding: 10px 14px;
      }

      .title-card h1 {
        font-size: 0.95rem;
      }

      .dock-divider {
        display: none;
      }

      .hud-btn {
        padding: 7px 10px;
        font-size: 0.78rem;
      }

      .calc-card {
        width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="hud-wrapper">
    <div class="top-bar">
      <div class="title-card">
        <h1>Шарын Шатқалы: Эко-туризм 3D Моделі</h1>
        <div class="title-subtitle">Қамалдар аңғары · 4 эко-киіз үй · Өзен арнасы · Джип туры</div>
      </div>

      <div class="calc-card" id="calcCard">
        <button class="calc-header" id="calcToggleBtn" type="button" aria-expanded="true">
          <span>Экономикалық калькулятор</span>
          <span class="calc-chevron">▼</span>
        </button>
        <div class="calc-body" id="calcBody">
          <div class="slider-group">
            <div class="slider-label-row">
              <span class="slider-label">Күндік туристер</span>
              <span class="slider-value" id="touristsVal">200 адам</span>
            </div>
            <input type="range" id="touristsSlider" min="50" max="500" step="10" value="200" />
          </div>

          <div class="slider-group">
            <div class="slider-label-row">
              <span class="slider-label">Билет бағасы</span>
              <span class="slider-value" id="priceVal">4 500 ₸</span>
            </div>
            <input type="range" id="priceSlider" min="2000" max="10000" step="500" value="4500" />
          </div>

          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-label">Жылдық табыс (млн ₸)</div>
              <div class="metric-value" id="annualRevenue">328.5 млн ₸</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Өтелу мерзімі (жыл)</div>
              <div class="metric-value payback" id="paybackPeriod">2.1 жыл</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-dock">
      <div class="dock-panel">
        <div class="btn-group" role="group" aria-label="Жыл мезгілдері">
          <button class="hud-btn season-btn active" data-season="summer" type="button">☀ Жаз</button>
          <button class="hud-btn season-btn" data-season="winter" type="button">❄ Қыс</button>
          <button class="hud-btn season-btn" data-season="spring" type="button">🌸 Көктем</button>
          <button class="hud-btn season-btn" data-season="autumn" type="button">🍂 Күз</button>
        </div>

        <div class="dock-divider"></div>

        <div class="btn-group" role="group" aria-label="Камера режимдері">
          <button class="hud-btn cam-btn active" data-cam="free" type="button">🔭 Еркін шолу</button>
          <button class="hud-btn cam-btn" data-cam="eagle" type="button">🦅 Бүркітпен ұшу</button>
          <button class="hud-btn cam-btn" data-cam="jeep" type="button">🚙 Джиппен жүру</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    (function () {
      'use strict';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.0036);

      const camera = new THREE.PerspectiveCamera(
        52,
        window.innerWidth / window.innerHeight,
        0.5,
        500
      );
      camera.position.set(0, 45, 85);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      renderer.domElement.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      });

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.48;
      controls.minDistance = 16;
      controls.maxDistance = 145;
      controls.update();

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0x9be0ff, 0x9b5434, 0.35);
      hemiLight.position.set(0, 60, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      dirLight.position.set(42, 68, 48);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 10;
      dirLight.shadow.camera.far = 220;
      const shadowExtent = 78;
      dirLight.shadow.camera.left = -shadowExtent;
      dirLight.shadow.camera.right = shadowExtent;
      dirLight.shadow.camera.top = shadowExtent;
      dirLight.shadow.camera.bottom = -shadowExtent;
      dirLight.shadow.bias = -0.0005;
      dirLight.shadow.normalBias = 0.03;
      scene.add(dirLight);

      function canyonCenterX(z) {
        return Math.sin(z * 0.04) * 8.5 + Math.cos(z * 0.021) * 2.5;
      }

      function riverCenterX(z) {
        return canyonCenterX(z) - 9.8 + Math.sin(z * 0.085) * 1.4;
      }

      function getTerrainHeight(x, z) {
        const cx = canyonCenterX(z);
        const dx = Math.abs(x - cx);
        const rx = Math.abs(x - riverCenterX(z));

        if (dx < 18.5) {
          let bed = 0;
          if (rx < 3.4) {
            const rt = 1 - rx / 3.4;
            bed = -0.55 * rt * rt;
          }
          const micro = Math.sin(x * 0.14 + z * 0.11) * 0.12;
          const roadMask = Math.max(0, 1 - Math.abs(dx - 10.5) / 5.5);
          return bed + micro * (1 - roadMask) * (rx < 4.2 ? 0 : 1);
        }

        const t = Math.min(1, (dx - 18.5) / 36);
        const baseRise = Math.pow(t, 0.72) * 27;
        const strataSteps = Math.sin(baseRise * 0.82) * 0.95 * t;
        const erosion =
          (Math.sin(x * 0.18 + z * 0.14) * 1.9 +
            Math.cos(x * 0.31 - z * 0.23) * 1.15 +
            Math.sin(z * 0.42) * 0.65) *
          Math.min(1, t * 1.4);

        return Math.max(0, baseRise + strataSteps + erosion);
      }

      function createRockNoiseTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#e5e5e5';
        ctx.fillRect(0, 0, 256, 256);

        for (let y = 0; y < 256; y += 4) {
          const band = 215 + Math.sin(y * 0.18) * 18 + (Math.random() - 0.5) * 18;
          ctx.fillStyle = `rgb(${band | 0}, ${(band * 0.96) | 0}, ${(band * 0.93) | 0})`;
          ctx.fillRect(0, y, 256, 4);
        }
        for (let i = 0; i < 1800; i++) {
          const px = Math.random() * 256;
          const py = Math.random() * 256;
          const sz = 1 + Math.random() * 2.5;
          const v = 180 + Math.random() * 65;
          ctx.fillStyle = `rgba(${v | 0},${v | 0},${v | 0},0.22)`;
          ctx.fillRect(px, py, sz, sz);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(8, 8);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      const terrainGeo = new THREE.PlaneGeometry(160, 160, 64, 64);
      terrainGeo.rotateX(-Math.PI / 2);

      const posAttr = terrainGeo.attributes.position;
      const vertCount = posAttr.count;
      const terrainBaseHeights = new Float32Array(vertCount);
      const terrainColors = new Float32Array(vertCount * 3);

      for (let i = 0; i < vertCount; i++) {
        const vx = posAttr.getX(i);
        const vz = posAttr.getZ(i);
        const vy = getTerrainHeight(vx, vz);
        posAttr.setY(i, vy);
        terrainBaseHeights[i] = vy;
      }

      terrainGeo.setAttribute('color', new THREE.BufferAttribute(terrainColors, 3));
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        map: createRockNoiseTexture(),
        roughness: 0.9,
        metalness: 0.04,
      });

      const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
      terrainMesh.receiveShadow = true;
      terrainMesh.castShadow = true;
      scene.add(terrainMesh);

      const spireGroup = new THREE.Group();
      const spireMat = new THREE.MeshStandardMaterial({
        color: 0xb94a2a,
        roughness: 0.88,
        metalness: 0.05,
        flatShading: true,
      });

      const spirePlacements = [
        [-28, -54, 1.3], [-32, -26, 1.5], [-26, 6, 1.2], [-34, 34, 1.4], [-27, 56, 1.15],
        [30, -52, 1.4],  [26, -18, 1.25], [33, 14, 1.55], [27, 42, 1.3],  [32, 62, 1.2]
      ];

      const spireGeo = new THREE.CylinderGeometry(1.4, 4.2, 11, 7);
      const spireCapGeo = new THREE.DodecahedronGeometry(2.1, 0);

      spirePlacements.forEach(function (item) {
        const sx = item[0] + canyonCenterX(item[1]) * 0.35;
        const sz = item[1];
        const sc = item[2];
        const sy = getTerrainHeight(sx, sz);

        const tower = new THREE.Group();
        const body = new THREE.Mesh(spireGeo, spireMat);
        body.position.y = 4.5 * sc;
        body.scale.set(sc, sc, sc);
        body.castShadow = true;
        body.receiveShadow = true;
        tower.add(body);

        const cap = new THREE.Mesh(spireCapGeo, spireMat);
        cap.position.set(0.3 * sc, 9.8 * sc, -0.2 * sc);
        cap.scale.set(sc * 0.9, sc * 0.75, sc * 0.9);
        cap.rotation.y = sx * 0.4;
        cap.castShadow = true;
        cap.receiveShadow = true;
        tower.add(cap);

        tower.position.set(sx, sy - 0.6, sz);
        tower.rotation.y = (sx + sz) * 0.25;
        spireGroup.add(tower);
      });
      scene.add(spireGroup);

      function createRibbonGeometry(centerFn, halfWidthFn, zMin, zMax, segments, yBase) {
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let i = 0; i <= segments; i++) {
          const t = i / segments;
          const z = zMin + (zMax - zMin) * t;
          const cx = centerFn(z);
          const hw = halfWidthFn(z);

          positions.push(cx - hw, yBase, z);
          positions.push(cx + hw, yBase, z);
          uvs.push(0, t * 14);
          uvs.push(1, t * 14);

          if (i < segments) {
            const row = i * 2;
            indices.push(row, row + 2, row + 1);
            indices.push(row + 1, row + 2, row + 3);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      function createWaterTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#14b8a6';
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 160; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          const w = 10 + Math.random() * 34;
          const h = 3 + Math.random() * 6;
          ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.2)' : 'rgba(6,182,212,0.32)';
          ctx.fillRect(x, y, w, h);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      const waterTex = createWaterTexture();
      const riverGeo = createRibbonGeometry(
        riverCenterX,
        function (z) {
          return 2.9 + Math.sin(z * 0.12) * 0.45;
        },
        -79,
        79,
        96,
        0.14
      );
      const riverMat = new THREE.MeshStandardMaterial({
        color: 0x14c8be,
        map: waterTex,
        roughness: 0.16,
        metalness: 0.18,
        transparent: true,
        opacity: 0.9,
      });
      const riverMesh = new THREE.Mesh(riverGeo, riverMat);
      riverMesh.receiveShadow = true;
      scene.add(riverMesh);

      const roadPoints = [];
      for (let z = 62; z >= -62; z -= 8) {
        roadPoints.push(new THREE.Vector3(canyonCenterX(z) + 7.2, 0.08, z));
      }
      roadPoints.push(new THREE.Vector3(canyonCenterX(-67) + 10.5, 0.08, -68));
      for (let z = -62; z <= 62; z += 8) {
        roadPoints.push(new THREE.Vector3(canyonCenterX(z) + 13.4, 0.08, z));
      }
      roadPoints.push(new THREE.Vector3(canyonCenterX(67) + 10.5, 0.08, 68));

      const roadCurve = new THREE.CatmullRomCurve3(roadPoints, true, 'catmullrom', 0.5);

      function buildClosedRoadMesh(curve, halfW, segs) {
        const positions = [];
        const indices = [];
        const up = new THREE.Vector3(0, 1, 0);

        for (let i = 0; i <= segs; i++) {
          const u = (i % segs) / segs;
          const pt = curve.getPointAt(u);
          const tan = curve.getTangentAt(u).normalize();
          const side = new THREE.Vector3().crossVectors(up, tan).normalize();

          const left = pt.clone().addScaledVector(side, -halfW);
          const right = pt.clone().addScaledVector(side, halfW);
          positions.push(left.x, 0.06, left.z);
          positions.push(right.x, 0.06, right.z);

          if (i < segs) {

      function applySeason(seasonKey) {
        const theme = SEASON_THEMES[seasonKey];
        if (!theme) return;
        currentSeason = seasonKey;

        scene.background.setHex(theme.sky);
        scene.fog.color.setHex(theme.sky);
        scene.fog.density = theme.fogDensity;

        ambientLight.intensity = theme.ambientIntensity;
        dirLight.color.setHex(theme.dirColor);
        dirLight.intensity = theme.dirIntensity;
        hemiLight.color.setHex(theme.hemiSky);
        hemiLight.groundColor.setHex(theme.hemiGround);

        const colAttr = terrainGeo.attributes.color;
        for (let i = 0; i < vertCount; i++) {
          const vx = posAttr.getX(i);
          const vy = terrainBaseHeights[i];
          const vz = posAttr.getZ(i);

          if (vy < 0.65) {
            _tmpColor.copy(theme.floorColor);
            if (vy < -0.05) {
              _tmpColor.multiplyScalar(0.76);
            }
          } else {
            const ht = Math.min(1, vy / 28);
            _tmpColor.copy(theme.cliffLowColor).lerp(theme.cliffHighColor, ht);
            const band = Math.sin(vy * 0.9 + vx * 0.05 + vz * 0.05) * 0.5 + 0.5;
            if (band > 0.65) {
              _tmpColor.lerp(theme.strataColor, (band - 0.65) * 1.6);
            }
          }
          colAttr.setXYZ(i, _tmpColor.r, _tmpColor.g, _tmpColor.b);
        }
        colAttr.needsUpdate = true;

        spireMat.color.setHex(theme.spireColor);
        riverMat.color.setHex(theme.riverColor);
        riverMat.roughness = theme.riverRoughness;
        riverMat.metalness = theme.riverMetalness;
        riverMat.opacity = theme.riverOpacity;
        roadMat.color.setHex(theme.roadColor);
        foliageMat.color.setHex(theme.foliageColor);

          blossomMeshes[i].visible = theme.showBlossoms;

        if (theme.particles === 'snow') {
          weatherParticles.visible = true;
          particleMat.color.setHex(0xffffff);

      function updateCalculator() {
        const tourists = Number(touristsSlider.value);

        touristsVal.textContent = tourists + ' адам';
        priceVal.textContent = price.toLocaleString('ru-RU') + ' ₸';

        const annualMln = (tourists * price * 365) / 1000000;
        annualRevenueEl.textContent = annualMln.toFixed(1) + ' млн ₸';

        const capexMln = 450;
        const netMargin = 0.65;
        const paybackYears = capexMln / (annualMln * netMargin);
        paybackPeriodEl.textContent = paybackYears.toFixed(1) + ' жыл';

      const clock = new THREE.Clock();
      let jeepProgress = 0;
      let eagleAngle = 0;

      const _jeepPos = new THREE.Vector3();
      const _jeepLook = new THREE.Vector3();
      const _jeepTangent = new THREE.Vector3();
      const _camDesiredPos = new THREE.Vector3();
      const _camDesiredLook = new THREE.Vector3();
      const _camCurrentLook = new THREE.Vector3(0, 0, 0);

      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        jeepProgress = (jeepProgress + delta * 0.032) % 1;
        roadCurve.getPointAt(jeepProgress, _jeepPos);
        roadCurve.getTangentAt(jeepProgress, _jeepTangent).normalize();
        _jeepLook.copy(_jeepPos).add(_jeepTangent);

        jeepGroup.position.set(
          _jeepPos.x,
          0.08 + Math.sin(elapsed * 14) * 0.025,
          _jeepPos.z
        );
        jeepGroup.lookAt(_jeepLook.x, jeepGroup.position.y, _jeepLook.z);

        for (let i = 0; i < wheelMeshes.length; i++) {
          wheelMeshes[i].rotation.x += delta * 9.5;
        }

        if (currentSeason !== 'winter') {
          waterTex.offset.y -= delta * 0.35;
        }

        eagleAngle += delta * 0.28;
        const ex = Math.cos(eagleAngle) * 32;
        const ez = Math.sin(eagleAngle) * 48;
        const ey = 32 + Math.sin(elapsed * 1.4) * 2.5;
        eagleGroup.position.set(ex, ey, ez);
        eagleGroup.rotation.y = -eagleAngle;
        const flap = Math.sin(elapsed * 4.5) * 0.22;
        leftWing.rotation.z = flap;
        rightWing.rotation.z = -flap;

        if (weatherParticles.visible) {
          const pArr = particleGeo.attributes.position.array;
          const fallSpeed = currentSeason === 'winter' ? 5.5 : 4.2;
          const sway = currentSeason === 'winter' ? 1.4 : 2.8;
          for (let i = 0; i < particleCount; i++) {
            const idx = i * 3;
            pArr[idx + 1] -= delta * fallSpeed;
            pArr[idx] += Math.sin(elapsed + i) * delta * sway;
            if (pArr[idx + 1] < 0.5) {
              pArr[idx + 1] = 52 + Math.random() * 8;
              pArr[idx] = (Math.random() - 0.5) * 140;
            }
          }
          particleGeo.attributes.position.needsUpdate = true;
        }

        const dampFactor = 1 - Math.exp(-4.5 * delta);

        if (cameraMode === 'eagle') {
          const orbitRadius = 66;
          _camDesiredPos.set(
            Math.cos(eagleAngle) * orbitRadius,
            40 + Math.sin(elapsed * 0.5) * 4,
            Math.sin(eagleAngle) * orbitRadius
          );
          _camDesiredLook.set(0, 3, 0);
          camera.position.lerp(_camDesiredPos, dampFactor);
          _camCurrentLook.lerp(_camDesiredLook, dampFactor);
          camera.lookAt(_camCurrentLook);
          controls.target.copy(_camCurrentLook);
        } else if (cameraMode === 'jeep') {
          _camDesiredPos
            .copy(_jeepPos)
            .addScaledVector(_jeepTangent, -12.5);
          _camDesiredPos.y = 6.2;
          _camDesiredLook
            .copy(_jeepPos)
            .addScaledVector(_jeepTangent, 8.0);
          _camDesiredLook.y = 2.0;

          camera.position.lerp(_camDesiredPos, dampFactor);
          _camCurrentLook.lerp(_camDesiredLook, dampFactor);
          camera.lookAt(_camCurrentLook);
          controls.target.copy(_camCurrentLook);
        } else {
          if (freeResetActive) {
            camera.position.lerp(freeDefaultPos, dampFactor);
            controls.target.lerp(freeDefaultTarget, dampFactor);
            if (camera.position.distanceTo(freeDefaultPos) < 0.35) {
              freeResetActive = false;
            }
          }
          _camCurrentLook.copy(controls.target);
          controls.update();
        }

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      });
    })();
  </script>
</body>
</html>
